<!doctype html>
<html dir="ltr" lang="tr" lazy-loaded="true">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chrome Home</title>
    <style>
      body {
        background: #333C4D;
        margin: 0;
        min-height: 100vh;
        color: rgba(232, 234, 237, 1.00);
        font-family: Arial, Helvetica, sans-serif;
      }

      #backgroundImage {
        border: none;
        height: 100%;
        pointer-events: none;
        position: fixed;
        top: 0;
        visibility: hidden;
        width: 100%;
      }

      [show-background-image] #backgroundImage {
        visibility: visible;
      }

      .ntp-shell {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 24px;
      }

      .ntp-card {
        width: min(720px, 100%);
        padding: clamp(24px, 6vw, 56px);
        border: 1px solid rgba(232, 234, 237, 0.24);
        border-radius: 28px;
        background: rgba(32, 38, 49, 0.72);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.32);
        text-align: center;
      }

      .ntp-logo {
        margin: 0 0 20px;
        color: rgba(232, 234, 237, 1.00);
        font-size: clamp(44px, 10vw, 88px);
        font-weight: 700;
        letter-spacing: -0.03em;
      }

      .chrome-mark {
        display: block;
        width: clamp(86px, 18vw, 126px);
        height: clamp(86px, 18vw, 126px);
        margin: 0 auto 22px;
        border-radius: 50%;
        background: radial-gradient(circle at center, #4285f4 0 28%, #fff 29% 36%, transparent 37%), conic-gradient(#ea4335 0 33%, #fbbc05 0 66%, #34a853 0 82%, #4285f4 0 100%);
        box-shadow: 0 18px 44px rgba(0, 0, 0, 0.34);
      }

      .ntp-search {
        display: flex;
        gap: 12px;
        margin: 0 auto;
        max-width: 620px;
      }

      .ntp-search input {
        flex: 1;
        min-height: 52px;
        padding: 0 18px;
        border: 1px solid rgba(232, 234, 237, 0.24);
        border-radius: 999px;
        outline: none;
        color: rgba(232, 234, 237, 1.00);
        background: rgba(25, 30, 39, 0.78);
        font: inherit;
      }

      .ntp-search button {
        min-height: 52px;
        padding: 0 22px;
        border: 1px solid rgba(170, 199, 255, 0.55);
        border-radius: 999px;
        color: rgba(232, 234, 237, 1.00);
        background: rgba(90, 120, 180, 0.38);
        cursor: pointer;
        font: inherit;
        font-weight: 700;
      }

      .ntp-note {
        margin: 18px 0 0;
        color: rgba(232, 234, 237, 0.72);
        line-height: 1.55;
      }
    </style>
  </head>
  <body style="background-color: rgb(51, 60, 77);">
    <iframe id="backgroundImage" src=""></iframe>
    <ntp-app realbox-can-show-secondary-side="" modules-loaded-status_="0" style="--ntp-logo-color: rgba(170, 199, 255, 1.00); --color-new-tab-page-attribution-foreground: rgba(232, 234, 237, 1.00); --color-new-tab-page-most-visited-foreground: rgba(232, 234, 237, 1.00);"></ntp-app>
    <main class="ntp-shell" aria-label="Chrome home page">
      <section class="ntp-card">
        <span class="chrome-mark" aria-hidden="true"></span>
        <h1 class="ntp-logo">Google Chrome</h1>
        <form class="ntp-search" id="ntp-search-form">
          <input id="ntp-search-input" type="search" placeholder="Search Google or type a URL" autocomplete="off" />
          <button type="submit">Search Google</button>
        </form>
        <p class="ntp-note">This Chrome-style start page opens first and on every new tab. Searches go through Google, website URLs open normally, and the separate İstek AI page is left unchanged.</p>
      </section>
    </main>
    <script>
      const form = document.querySelector('#ntp-search-form');
      const input = document.querySelector('#ntp-search-input');
      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const query = input.value.trim();
        if (!query) return;
        const hasScheme = /^https?:\/\//i.test(query);
        const looksLikeSite = /\.[a-z]{2,}(\/|$)/i.test(query) || /^localhost(:\d+)?/i.test(query);
        const target = hasScheme ? query : looksLikeSite ? `https://${query}` : `https://www.google.com/search?q=${encodeURIComponent(query)}`;
        window.location.href = target;
      });
    </script>
  </body>
</html>
