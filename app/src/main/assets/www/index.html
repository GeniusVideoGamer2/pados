<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Google Chrome for İstek</title>
    <meta name="description" content="A Chrome-style Android web app shell with Google Search, normal website navigation, and the existing İstek AI page kept unchanged." />
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="browser-shell">
      <section class="topbar" aria-label="Browser controls">
        <div class="brand"><span class="chrome-mark" aria-hidden="true"></span><strong>Google Chrome</strong><small>İstek app</small></div>
        <form id="address-form" class="address-form">
          <label class="sr-only" for="address-input">Search Google or enter website address in Chrome</label>
          <input id="address-input" type="search" placeholder="Search Google or type a URL" autocomplete="off" />
          <button id="search-button" class="glass-button" type="submit">Search Google</button>
          <button id="gemini-mode-button" class="glass-button mode-button" type="button" aria-pressed="false">Gemini AI</button>
        </form>
        <button id="new-tab-button" class="glass-button" type="button">+ Chrome tab</button>
      </section>

      <nav id="tab-strip" class="tab-strip" aria-label="Open pages"></nav>

      <section class="browser-stage">
        <aside class="start-panel">
          <span class="start-logo chrome-mark large" aria-hidden="true"></span>
          <h1>Google Chrome</h1>
          <p>This APK starts on a Chrome-style home page. Type in either search bar to search through Google or enter a website address. The İstek AI page stays open as its own unchanged tab.</p>
          <form id="hero-search-form" class="hero-search">
            <input id="hero-search-input" type="search" placeholder="Search Google" />
            <button class="glass-button" type="submit">Search Google</button>
          </form>
          <div id="gemini-answer" class="gemini-answer" aria-live="polite">Gemini AI answers will appear here when AI mode is on.</div>
          <div class="quick-actions">
            <button class="glass-button" type="button" data-quick="new_tab.html">Chrome Home</button>
            <button class="glass-button" type="button" data-quick="https://www.google.com/">Google Home</button>
            <button class="glass-button" type="button" data-quick="https://geniusvideogamer2.github.io/pados/">İstek AI</button>
          </div>
        </aside>
        <iframe id="browser-frame" title="Current web page" sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts allow-top-navigation-by-user-activation"></iframe>
      </section>
    </main>
    <script src="app.js" defer></script>
  </body>
</html>
