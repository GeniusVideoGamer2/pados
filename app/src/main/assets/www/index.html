<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ISTEK BROWSER</title>
    <meta name="description" content="ISTEK BROWSER is a glass-style multi-page web browser with www.google.com as the first page, Google-powered search, website navigation, and an always-open İstek AI page." />
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="browser-shell">
      <section class="topbar" aria-label="Browser controls">
        <div class="brand"><img src="assets/logo.svg" alt="Mersin İstek Okulları logo" /><strong>ISTEK BROWSER</strong></div>
        <form id="address-form" class="address-form">
          <label class="sr-only" for="address-input">Search Google or enter website address</label>
          <input id="address-input" type="search" placeholder="Search Google or type a website address" autocomplete="off" />
          <button class="glass-button" type="submit">Search</button>
        </form>
        <button id="new-tab-button" class="glass-button" type="button">+ Page</button>
      </section>

      <nav id="tab-strip" class="tab-strip" aria-label="Open pages"></nav>

      <section class="browser-stage">
        <aside class="start-panel">
          <img class="start-logo" src="assets/logo.svg" alt="" />
          <h1>İSTEK</h1>
          <p>www.google.com opens as the first page. Search anything through Google, open websites, and keep İstek AI ready on the second page.</p>
          <form id="hero-search-form" class="hero-search">
            <input id="hero-search-input" type="search" placeholder="Search Google" />
            <button class="glass-button" type="submit">Google Search</button>
          </form>
          <div class="quick-actions">
            <button class="glass-button" type="button" data-quick="https://www.google.com/">Google Home</button>
            <button class="glass-button" type="button" data-quick="https://www.google.com/search?q=İstek+Okulları">İstek Search</button>
            <button class="glass-button" type="button" data-quick="https://geniusvideogamer2.github.io/pados/">İstek AI</button>
          </div>
        </aside>
        <iframe id="browser-frame" title="Current web page" sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts allow-top-navigation-by-user-activation"></iframe>
      </section>
    </main>
    <script src="app.js" defer></script>
  </body>
</html>
