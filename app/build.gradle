plugins {
    id 'com.android.application'
}

android {
    buildFeatures {
        buildConfig true
    }

    namespace 'web.browser.istekbrowser'
    compileSdk 35

    defaultConfig {
        applicationId 'web.browser.istekbrowser'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        buildConfigField 'String', 'GEMINI_API_KEY', '"' + (project.findProperty('GEMINI_API_KEY') ?: System.getenv('GEMINI_API_KEY') ?: System.getenv('GOOGLE_AI_API_KEY') ?: '') + '"'
    }
}


// Gemini is called through the native REST bridge in MainActivity so the APK build
// does not depend on an unresolved external client artifact.
